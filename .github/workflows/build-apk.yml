name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-npm
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_BAIDU_API_KEY=${{ secrets.BAIDU_API_KEY }}" > .env
          echo "EXPO_PUBLIC_BAIDU_SECRET_KEY=${{ secrets.BAIDU_SECRET_KEY }}" >> .env
          echo "EXPO_PUBLIC_ZHIPU_API_KEY=${{ secrets.ZHIPU_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_SILICONFLOW_API_KEY=${{ secrets.SILICONFLOW_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_ALIBABA_API_KEY=${{ secrets.ALIBABA_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_DOUBAO_API_KEY=${{ secrets.DOUBAO_API_KEY }}" >> .env

      - name: Build APK
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs="-Xmx4096m"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --warning-mode summary

      - name: Get version from app.json
        id: get_version
        run: |
          VERSION=$(node -e "const pkg = require('./app.json'); console.log(pkg.expo.version);")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "App version: $VERSION"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v${{ steps.get_version.outputs.VERSION }}
          path: android/app/build/outputs/apk/release/*.apk
          compression-level: 0
